<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nxlebot Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{background:#1e293b;padding:15px 20px;border-bottom:1px solid #334155;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#10b981);display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:75%}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.av{width:36px;height:36px;border-radius:10px;background:#334155;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0}
.msg.user .av{background:linear-gradient(135deg,#3b82f6,#10b981)}
.txt{background:#1e293b;padding:10px 14px;border-radius:14px;line-height:1.4;border:1px solid #334155}
.msg.user .txt{background:linear-gradient(135deg,#3b82f6,#2563eb);border:none}
.time{font-size:.7rem;color:#94a3b8;margin-top:4px;text-align:right}
.input{background:#1e293b;border-top:1px solid #334155;padding:15px}
.iw{max-width:800px;margin:0 auto;display:flex;gap:10px}
.ib{flex:1;background:#334155;border-radius:12px;border:2px solid transparent;transition:.3s}
.ib:focus-within{border-color:#3b82f6}
#m{width:100%;background:0 0;border:0;padding:12px 16px;color:#fff;font-size:1rem;outline:0;resize:none;min-height:48px}
#s{background:linear-gradient(135deg,#3b82f6,#10b981);color:#fff;border:0;border-radius:12px;width:50px;height:50px;cursor:pointer;font-size:1.3rem;transition:.3s}
#s:hover{transform:translateY(-2px)}
.welcome{text-align:center;padding:60px 20px}
.e{font-size:4rem;margin-bottom:20px}
.welcome h2{margin-bottom:10px}
.welcome p{color:#94a3b8}
</style>
</head>
<body>
<div class="header">
<div class="logo">🤖</div>
<div><strong>Nxlebot</strong><div style="font-size:.8rem;color:#94a3b8">Online</div></div>
</div>
<div class="chat" id="c">
<div class="welcome" id="w">
<div class="e">👋</div>
<h2>Selamat Datang!</h2>
<p>Chat dengan Nxlebot</p>
</div>
</div>
<div class="input">
<div class="iw">
<div class="ib"><textarea id="m" placeholder="Ketik pesan..." rows="1"></textarea></div>
<button id="s" onclick="send()">➤</button>
</div>
</div>
<script>
const c=document.getElementById('c'),m=document.getElementById('m'),s=document.getElementById('s'),w=document.getElementById('w');
let ids=new Set(),loaded=false;

m.addEventListener('input',()=>{m.style.height='auto';m.style.height=Math.min(m.scrollHeight,120)+'px';s.disabled=!m.value.trim()});
m.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});

async function load(){
try{
const r=await fetch('/api/history'),d=await r.json();
if(d.messages&&d.messages.length>0&&!loaded){
w.remove();loaded=true;
d.messages.forEach(x=>{if(!ids.has(x.id)){add(x.id,x.text,!x.is_user,x.time);ids.add(x.id)}});
}
}catch(e){}
}

function add(id,txt,bot,time){
if(ids.has(id))return;
const d=document.createElement('div');
d.className='msg'+(bot?' bot':' user');
d.innerHTML='<div class="av">'+(bot?'🤖':'👤')+'</div><div><div class="txt"></div><div class="time"></div></div>';
d.querySelector('.txt').textContent=txt;
d.querySelector('.time').textContent=time?new Date(time).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
c.appendChild(d);c.scrollTop=c.scrollHeight;ids.add(id);
}

async function send(){
const t=m.value.trim();if(!t)return;
const tid='u'+Date.now();
add(tid,t,false);m.value='';m.style.height='auto';s.disabled=true;
try{
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t})});
const d=await r.json();
if(d.response)add(d.id||('b'+Date.now()),d.response,true,d.time);
}catch(e){add('e'+Date.now(),'Error',true);}
}

load();m.focus();s.disabled=true;
setInterval(load,10000);
</script>
</body>
</html>
