<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nxlebot Assistant - Connected</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --success: #10b981;
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-tertiary: #334155;
            --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #64748b;
            --msg-user: #2563eb; --msg-bot: #1e293b; --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; flex-direction: column; }
        .header { background: var(--bg-secondary); padding: 15px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
        .logo { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--success)); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .bot-info h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--text-secondary); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; gap: 12px; max-width: 75%; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-avatar { width: 40px; height: 40px; border-radius: 12px; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
        .message.user .message-avatar { background: linear-gradient(135deg, var(--primary), var(--success)); }
        .message-content { background: var(--msg-bot); padding: 14px 18px; border-radius: 16px; line-height: 1.6; border: 1px solid var(--border); }
        .message.user .message-content { background: linear-gradient(135deg, var(--primary), var(--success)); border: none; }
        .message-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 5px; text-align: right; }
        .typing-indicator { display: flex; gap: 6px; padding: 16px 20px; background: var(--msg-bot); border-radius: 16px; width: fit-content; margin-left: 52px; }
        .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); animation: typing 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        .input-area { background: var(--bg-secondary); border-top: 1px solid var(--border); padding: 20px 24px; }
        .input-container { max-width: 1200px; margin: 0 auto; display: flex; gap: 12px; }
        .input-wrapper { flex: 1; background: var(--bg-tertiary); border-radius: 16px; border: 2px solid transparent; transition: all 0.3s; }
        .input-wrapper:focus-within { border-color: var(--primary); }
        #messageInput { width: 100%; background: transparent; border: none; padding: 16px 20px; color: var(--text-primary); font-size: 1rem; outline: none; resize: none; min-height: 56px; }
        #sendBtn { background: linear-gradient(135deg, var(--primary), var(--success)); color: white; border: none; border-radius: 14px; width: 56px; height: 56px; cursor: pointer; font-size: 1.4rem; transition: all 0.3s; }
        #sendBtn:hover { transform: translateY(-2px) scale(1.05); }
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
        .welcome-emoji { font-size: 5rem; margin-bottom: 24px; animation: float 3s infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .welcome-title { font-size: 2rem; font-weight: 700; margin-bottom: 12px; }
        .welcome-subtitle { font-size: 1.1rem; color: var(--text-secondary); max-width: 500px; line-height: 1.6; }
        .sync-badge { background: var(--success); color: white; padding: 6px 16px; border-radius: 20px; font-size: 0.875rem; font-weight: 600; margin-top: 16px; display: inline-block; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">🤖</div>
        <div class="bot-info">
            <h1>Nxlebot Assistant</h1>
            <div class="status">
                <span class="status-dot"></span>
                <span>Online - Sync dengan Telegram</span>
            </div>
        </div>
    </header>

    <main class="chat-container" id="chatContainer">
        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-emoji">👋</div>
            <h2 class="welcome-title">Selamat Datang!</h2>
            <p class="welcome-subtitle">Chat terintegrasi dengan Telegram. Bisa pindah platform tanpa kehilangan history!</p>
            <div class="sync-badge">🔄 Real-time Sync Active</div>
        </div>
    </main>

    <div class="typing-indicator" id="typingIndicator" style="display: none;">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
    </div>

    <footer class="input-area">
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="messageInput" placeholder="Ketik pesan..." rows="1"></textarea>
            </div>
            <button id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </footer>

    <script>
        const API_BASE = 'http://localhost:5000';
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeScreen = document.getElementById('welcomeScreen');
        let messageCount = 0;

        // Load chat history on startup
        async function loadHistory() {
            try {
                const response = await fetch(`${API_BASE}/api/history?limit=50`);
                const data = await response.json();
                if (data.success && data.messages.length > 0) {
                    welcomeScreen.remove();
                    data.messages.forEach(msg => {
                        addMessageToUI(msg.text, !msg.is_user, msg.timestamp);
                    });
                    messageCount = data.messages.length;
                }
            } catch (error) {
                console.log('No history or backend unavailable');
            }
        }

        function addMessageToUI(text, isBot = false, timestamp = null) {
            if (welcomeScreen && welcomeScreen.parentNode && messageCount === 0) {
                welcomeScreen.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isBot ? 'bot' : 'user'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = isBot ? '🤖' : '👤';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            const meta = document.createElement('div');
            meta.className = 'message-meta';
            meta.textContent = timestamp ? new Date(timestamp).toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'}) : new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'});
            
            content.appendChild(meta);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            messageCount++;
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessageToUI(text, false);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            typingIndicator.style.display = 'flex';
            chatContainer.appendChild(typingIndicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                
                const data = await response.json();
                typingIndicator.style.display = 'none';
                
                if (data.success) {
                    addMessageToUI(data.response, true, data.timestamp);
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                addMessageToUI('⚠️ Backend tidak tersedia. Mode offline.', true);
            }
        }

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            sendBtn.disabled = !this.value.trim();
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-refresh history every 10 seconds (sync with Telegram)
        setInterval(async () => {
            try {
                const response = await fetch(`${API_BASE}/api/history?limit=1`);
                const data = await response.json();
                if (data.success && data.messages.length > messageCount) {
                    // New message from Telegram, reload full history
                    loadHistory();
                }
            } catch (error) {
                // Silent fail
            }
        }, 10000);

        loadHistory();
        messageInput.focus();
        sendBtn.disabled = true;
    </script>
</body>
</html>
