[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocplus"
version = "2.0.0"
description = "OC+ DSL — Pipeline Automation Language for developers"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nyxelle Ad & Nxlebot"}]
keywords = ["dsl", "pipeline", "automation", "devops", "ci-cd", "scripting"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/june-arthov/ocplus"
Documentation = "https://github.com/june-arthov/ocplus#readme"
Repository = "https://github.com/june-arthov/ocplus"
Issues = "https://github.com/june-arthov/ocplus/issues"

[project.scripts]
ocp = "ocplus.interpreter:main"

[tool.setuptools.packages.find]
where = ["."]
